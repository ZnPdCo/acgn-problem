name: Update data and deploy Pages

on:
  schedule:
    # GitHub Actions cron is UTC. 20:17 UTC = 04:17 Asia/Shanghai.
    - cron: "17 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Make sure scheduled runs have a local branch to commit data back to.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test parser and fetcher
        run: python -m unittest discover -s tests -v

      - name: Fetch and parse the latest article
        # Pushes build the data already committed in the repository; scheduled
        # and manually triggered runs refresh it from Luogu.
        if: github.event_name != 'push'
        env:
          LUOGU_COOKIE: ${{ secrets.LUOGU_COOKIE }}
        run: python scripts/update.py --min-works 50 --min-problems 200

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/article.md web/public/data/acgn.json; then
            echo "No data changes."
          else
            git add data/article.md web/public/data/acgn.json
            git commit -m "chore(data): refresh ACGN problem list"
            git push
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build web
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
